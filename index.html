<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/pokemon.png" />
    <link rel="stylesheet" href="style.css" />
</head>

<body onload="showPokemon()">
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <img src="./assets/icons/pokemon.png" alt="Loading">
            <h2>Load Pokémon...</h2>
        </div>
    </div>
    <header>
        <section class="pokemon_header">
            <img src="./assets/icons/pokemon.png" alt="Pokemon">
            <h1>Pokedex</h1>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Find Pokémon..." oninput="checkInput()">
                <button onclick="handleSearch()">Search</button>
                <span id="errorMessage" class="error-message">Please enter at least 3 characters.</span>
            </div>
        </section>
    </header>
    <main id="content"></main>
    <dialog id="pokemonDialog" onclick="if(event.target.id === 'pokemonDialog') this.close()"></dialog>
    <div class="load-more-container">
        <button id="loadMoreBtn" onclick="loadMorePokemon()" class="load-more-btn">
            Load more
        </button>

    </div>

    <footer>
        <p>&copy; 2026 Pokedex Projekt</p>
    </footer>
    
    <script src="assets/scripts/template.js"></script>
    <script src="script.js"></script>

</body>

</html>
